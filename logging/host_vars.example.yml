# Copy to host_vars/<inventory host>.yml next to the playbooks.
# On a PVE host: the LXC containers that rsyslog_client.yml configures with pct.
logging_lxc_ids: [302, 305, 306, 307, 308]
# Set to false if the node is in a cluster or has HA resources.
logging_pve_mask_ha: true
# The PVE host relays the container logs. Listen on its LAN address only.
logging_relay_listen: 192.168.1.21
logging_relay_allowed: 192.168.1.0/24
